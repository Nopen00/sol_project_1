
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>드론 기상 위험 지도</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
    <style>
        /* 비행금지구역 범례 색상을 공역 격자와 일치시킴 */
        .legend-item .dot.no-fly { background-color: #000000 !important; }
    </style>
</head>

<body>
    <div id="map"></div>

    
<button
    id="menu-toggle"
    class="menu-toggle"
    type="button"
    aria-label="제어 패널 열기 또는 닫기"
    aria-controls="control-panel"
    aria-expanded="true"
>
    ☰
</button>

<div id="control-panel" class="legend">
    <h3>드론 기상 위험도</h3>

    <div class="legend-item">
        <span class="dot yellow"></span>
        <span>주의</span>
    </div>

    <div class="legend-item">
        <span class="dot orange"></span>
        <span>경고</span>
    </div>

    <div class="legend-item">
        <span class="dot red"></span>
        <span>위험</span>
    </div>

    <div class="legend-item">
        <span class="dot no-fly"></span>
        <span>비행금지구역</span>
    </div>

    <div class="legend-item">
        <span class="dot restricted"></span>
        <span>비행제한·관제권</span>
    </div>

    <div style="margin-top:10px">
      <label style="display:block"><input type="checkbox" id="show-prohibited" checked> 비행금지공역 표시</label>
      <label style="display:block"><input type="checkbox" id="show-restricted" checked> 비행제한·관제권 표시</label>
    </div>
    <p style="font-size:11px;line-height:1.4">비행금지공역(P), 비행제한공역(R), 관제권이 격자에 일부만 겹쳐도 전체 칸에 표시됩니다. 실제 비행 가능 여부와 최신 공역 정보는 공식 기관에서 확인하세요.</p>
    <hr>

    <h4>지역 선택</h4>

    <label for="province-select">시·도</label>
    <select id="province-select"></select>

    <label for="city-select">시·군·구</label>
    <select id="city-select"></select>

    <button id="reset-map" class="reset-map" type="button">
        ↺ 전국 지도로 돌아가기
    </button>

    <div id="status">
        기상정보 준비 중...
    </div>
</div>


    <script src="/static/js/weather.js"></script>
    <script src="/static/js/grid-map.js?v=20261016-core"></script>
    <script src="/static/js/risk-map.js"></script>
    <script src="/static/js/airspace-map.js?v=20261016-core"></script>
    <script src="/static/js/map.js?v=20261016-core"></script>
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_api_key }}&autoload=false"
        onload="initMap()"
        onerror="document.getElementById('status').textContent='카카오맵 SDK 로드 실패'">
    </script>
</body>
</html>
